# Il contratto GraphQL, generato dallo schema vero del server.
#
# Non si scrive a mano: la versione precedente era scritta a mano ed è andata
# alla deriva senza che nessuno se ne accorgesse, le mancavano i preferiti,
# l'anteprima dei filtri, lo storico, il progresso e metà dei campi di Listing.
# Per rifarlo, con il server in ascolto:
#
#   pnpm --filter api schema
#
type Country {
  code: String!
  name: String!
}

type Listing {
  ageDays: Int!
  cautions: [String!]!
  chassis: String
  city: String
  country: String
  cpu: String
  cpuNum: String
  description: String
  distanceKm: Int
  family: String
  firstSeen: String!
  generation: Int
  hddGb: Int
  id: Int!
  imageUrl: String
  isFavourite: Boolean!
  isNew: Boolean!
  memPer: Int
  memSpeed: Int
  memSticks: Int
  memTotal: Int
  model: String
  positivePct: Int
  postedApprox: Boolean!
  postedAt: String
  price: Float!
  priceMax: Float
  priceMin: Float
  ramGb: Int
  reviews: Int
  shippable: Boolean!
  soldAt: String
  source: String!
  ssdGb: Int
  storageGb: Int
  tiered: Boolean!
  title: String!
  url: String!
  vendor: Vendor
  year: Int
}

type Mutation {
  createSearch(input: SearchInput!): Search!
  deleteSearch(id: Int!): Boolean!
  runSearch(id: Int!): RunResult!
  setFavourite(listingId: Int!, value: Boolean!): Boolean!
  sweep: Boolean!
  updateSearch(id: Int!, input: SearchInput!): Search!
  updateSettings(sweepMinutes: Int!): Settings!
}

type Place {
  country: String!
  label: String!
  lat: Float!
  lon: Float!
}

type Query {
  countries: [Country!]!
  favourites: [Listing!]!
  listings(searchId: Int!): [Listing!]!
  places(q: String!): [Place!]!
  preview(input: SearchInput!, searchId: Int!): [Listing!]!
  runHistory(limit: Int): [RunRecord!]!
  runProgress: [RunProgress!]!
  search(id: Int!): Search
  searches: [Search!]!
  settings: Settings!
  stats: Stats!
  version: Version!
}

type RunProgress {
  found: Int!
  label: String!
  phase: String!
  searchId: Int!
  startedAt: String!
  step: Int!
  steps: Int!
}

type RunRecord {
  error: String
  finishedAt: String
  found: Int
  id: Int!
  matched: Int
  offTopic: Int
  searchId: Int
  searchName: String
  startedAt: String!
  trigger: String!
}

type RunResult {
  found: Int!
  matched: Int!
  offTopic: Int!
}

type Search {
  brands: [String!]!
  chassis: [String!]!
  count: Int!
  countries: [String!]!
  cpuTiers: [String!]!
  enabled: Boolean!
  exclude: String!
  id: Int!
  includeUnlocated: Boolean!
  kind: SearchKind!
  lastRunAt: String
  lat: Float
  lon: Float
  maxPrice: Float!
  minGen: Int!
  minPrice: Float!
  minRam: Int!
  minReviews: Int!
  minStorage: Int!
  minYear: Int!
  name: String!
  newCount: Int!
  place: String
  query: String!
  radiusKm: Int!
  sources: [String!]!
  vendor: Vendor
}

input SearchInput {
  brands: [String!]
  chassis: [String!]
  countries: [String!]
  cpuTiers: [String!]
  enabled: Boolean
  exclude: String
  includeUnlocated: Boolean
  kind: SearchKind
  lat: Float
  lon: Float
  maxPrice: Float
  minGen: Int
  minPrice: Float
  minRam: Int
  minReviews: Int
  minStorage: Int
  minYear: Int
  name: String
  place: String
  query: String
  radiusKm: Int
  sources: [String!]
  vendor: Vendor
}

enum SearchKind {
  COMPUTER
  MEMORY
  OTHER
}

type Settings {
  defaultSweepMinutes: Int!
  sweepMinutes: Int!
}

type Stats {
  listings: Int!
  live: Int!
  searches: Int!
  sellers: Int!
  sold: Int!
}

enum Vendor {
  AMD
  INTEL
}

type Version {
  builtAt: String
  sha: String
}